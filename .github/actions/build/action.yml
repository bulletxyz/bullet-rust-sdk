name: "Build"
description: "Sets up environment and builds the WASM package"

inputs:
  node-version:
    description: "Node.js version to install"
    required: false
    default: "24.18.0"
  setup-npm-registry:
    description: "Setup NPM registry URL"
    required: false
    default: "false"
  working-directory:
    description: "Repository directory containing the SDK workspace"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.setup-npm-registry == 'true' && 'https://registry.npmjs.org' || '' }}

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: 1.97.0
        targets: wasm32-unknown-unknown

    - name: Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

    - name: Install wasm-pack
      # Don't use `cargo binstall` here — rust-cache (above) restores
      # `.crates2.json` metadata so binstall no-ops without placing the
      # binary on PATH.
      uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
      with:
        tool: wasm-pack@0.14.0

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Pin npm
      shell: bash
      run: npm install --global npm@11.12.0

    - name: Install npm dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}/wasm
      run: corepack pnpm install --frozen-lockfile

    - name: Build WASM
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: just build-wasm
