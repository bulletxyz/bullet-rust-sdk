name: "Build"
description: "Sets up environment and builds the WASM package"

inputs:
  node-version:
    description: "Node.js version to install"
    required: false
    default: "24.22.1"
  setup-npm-registry:
    description: "Setup NPM registry URL"
    required: false
    default: "false"
  working-directory:
    description: "Repository directory containing the SDK workspace"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.setup-npm-registry == 'true' && 'https://registry.npmjs.org' || '' }}

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: 1.99.1
        targets: wasm32-unknown-unknown

    - name: Rust cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Install wasm-pack
      # Don't use `cargo binstall` here — rust-cache (above) restores
      # `.crates2.json` metadata so binstall no-ops without placing the
      # binary on PATH.
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
      with:
        tool: wasm-pack@0.15.0

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Pin npm
      shell: bash
      run: npm install --global npm@11.12.0

    - name: Install npm dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}/wasm
      run: corepack pnpm install --frozen-lockfile

    - name: Build WASM
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: just build-wasm
