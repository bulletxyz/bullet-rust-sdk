name: Publish npm snapshot

# Keep this path stable: npm trusted publishing is bound to it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kind:
        required: true
        type: string
      version:
        required: true
        type: string
      commit:
        required: true
        type: string

concurrency:
  group: publish-npm-sdk
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted direct snapshot
        id: snapshot
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 .github/scripts/publish_snapshot.py validate-trigger \
            --kind sdk \
            --event "$GITHUB_EVENT_PATH" \
            --sha "${{ inputs.commit || github.sha }}" \
            --actor "$GITHUB_ACTOR" \
            --ref "$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --version-input "${{ inputs.version }}" \
            --output "$GITHUB_OUTPUT"

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0

      - name: Wait for exact interface and refresh lockfile
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_snapshot.py wait-crate \
            --crate bullet-exchange-interface \
            --version "${{ steps.snapshot.outputs.interface_version }}" \
            --commit "${{ steps.snapshot.outputs.interface_commit }}"
          cargo generate-lockfile
          test "$(git status --porcelain --untracked-files=all)" = "?? Cargo.lock"

      - name: Build exact WASM package
        uses: ./.github/actions/build
        with:
          node-version: 24.18.0
          setup-npm-registry: "true"

      - name: Verify locked versions and test
        env:
          INTERFACE_VERSION: ${{ steps.snapshot.outputs.interface_version }}
          VERSION: ${{ steps.snapshot.outputs.version }}
        run: |
          set -euo pipefail
          METADATA=$(cargo metadata --locked --format-version 1)
          test "$(jq -r '.packages[] | select(.name == "bullet-rust-sdk") | .version' <<< "$METADATA")" = "$VERSION"
          test "$(jq -r '.packages[] | select(.name == "bullet-rust-sdk-wasm") | .version' <<< "$METADATA")" = "$VERSION"
          test "$(node -p "require('./wasm/package.json').version")" = "$VERSION"
          test "$(jq -r --arg version "$INTERFACE_VERSION" '[.packages[] | select(.name == "bullet-exchange-interface" and .version == $version and (.source | startswith("registry+")))] | length' <<< "$METADATA")" = 1
          (cd wasm && corepack pnpm test --runInBand)

      - name: Pack once
        id: pack
        working-directory: wasm
        run: |
          set -euo pipefail
          PACK_DIR=$(mktemp -d)
          PACK_JSON=$(npm pack --json --pack-destination "$PACK_DIR")
          TARBALL=$(jq -er 'if length == 1 then .[0].filename else error("expected one tarball") end' <<< "$PACK_JSON")
          echo "tarball=$PACK_DIR/$TARBALL" >> "$GITHUB_OUTPUT"
          echo "integrity=$(jq -er '.[0].integrity' <<< "$PACK_JSON")" >> "$GITHUB_OUTPUT"
          echo "shasum=$(jq -er '.[0].shasum' <<< "$PACK_JSON")" >> "$GITHUB_OUTPUT"

      - name: Check existing npm package
        id: npm
        run: |
          python3 .github/scripts/publish_snapshot.py npm-status \
            --version "${{ steps.snapshot.outputs.version }}" \
            --commit "${{ steps.snapshot.outputs.commit }}" \
            --repository "$GITHUB_REPOSITORY" \
            --integrity "${{ steps.pack.outputs.integrity }}" \
            --shasum "${{ steps.pack.outputs.shasum }}" \
            --output "$GITHUB_OUTPUT"

      - name: Publish exact tarball
        if: steps.npm.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
        run: |
          set -euo pipefail
          TAG=latest
          case "$VERSION" in *-*) TAG=rc ;; esac
          npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --tag "$TAG"

      - name: Prove npm integrity and provenance
        run: |
          python3 .github/scripts/publish_snapshot.py retry-status \
            --artifact npm \
            --version "${{ steps.snapshot.outputs.version }}" \
            --commit "${{ steps.snapshot.outputs.commit }}" \
            --repository "$GITHUB_REPOSITORY" \
            --integrity "${{ steps.pack.outputs.integrity }}" \
            --shasum "${{ steps.pack.outputs.shasum }}"
