[package]
name = "bullet-rust-sdk-wasm"
version = "0.0.38"
edition = "2024"
license = "MIT"
repository = "https://github.com/bulletxyz/bullet-rust-sdk"
description = "WebAssembly bindings for the Bullet trading SDK"
publish = false # ships to npm as @bulletxyz/sdk-wasm, not crates.io

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bullet-rust-sdk = { workspace = true }
bullet-exchange-interface.workspace = true

wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
serde                = { version = "1", features = ["derive"] }
serde-wasm-bindgen   = "0.6"
js-sys               = "0.3"
serde_json           = "1"
rust_decimal         = { version = "1", features = ["serde-with-str", "maths"] }
reqwest              = "0.13"
hex                  = "0.4"
web-time             = "1.1"
console_error_panic_hook = "0.1"
futures-util         = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Declared to switch on its "js" feature for transitive users; never imported here.
getrandom = { version = "0.2", features = ["js"] }

[build-dependencies]
bullet-exchange-interface = { workspace = true, features = ["schema"] }
sov-universal-wallet = { version = "0.4", features = ["serde"] }
heck = "0.5"
quote = "1"
proc-macro2 = "1"
syn = "2"
prettyplease = "0.2"
strum = "0.28"

# Reached from build.rs and codegen/, which cargo shear does not scan, emitted into
# generated code inside a quote!, produced by the #[wasm_bindgen] expansion for async
# methods, or declared purely to enable a feature.
[package.metadata.cargo-shear]
ignored = [
    "futures-util",
    "getrandom",
    "heck",
    "prettyplease",
    "proc-macro2",
    "quote",
    "sov-universal-wallet",
    "strum",
    "syn",
    "wasm-bindgen-futures",
]
